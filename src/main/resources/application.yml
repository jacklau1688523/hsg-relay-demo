server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/relaydb;MODE=MySQL;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  # 静态页面 / JS 每次都向服务端确认是否有更新（未变化返回 304），
  # 避免浏览器按 Last-Modified 启发式缓存、在页面更新后仍显示旧菜单
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    # 条件求值过程日志（ExpressionService.evaluate）：每次求值输出一个 DEBUG 块，按 CANDIDATE / TRANSACTION / CONTEXT 三组列出上下文取值，
    # 以及函数调用、代入变量和每个叶子条件的真假，用于溯源。日志含客户与交易数据，生产环境请删除这一项或改为 info。
    com.hsg.relay.service.ExpressionService: debug
