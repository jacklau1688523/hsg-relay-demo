server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/relaydb;MODE=MySQL;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  # 静态页面 / JS 每次都向服务端确认是否有更新（未变化返回 304），
  # 避免浏览器按 Last-Modified 启发式缓存、在页面更新后仍显示旧菜单
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
